<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name_short }}</a>
            <nav>
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_interest' %}">Interests</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
            </nav>
        </div>
    </header>

    <main class="profile">
        <section class="profile-leftside-image">
            <div class="photo-block"></div>
            <img class="avatar" src="/static/img/myPic.jpg" alt="Photo of {{ name }}">
        </section>

        <section class="profile-main">
            <div class="profile-information">
                <div class="identity">
                    <p class="text-accented">COMPUTER SCIENCE &middot; UNIVERSITAS INDONESIA</p>
                    <h1 class="text-main">{{ name }}</h1>
                    <p class="text-normal">{{ bio }}</p>
                </div>
                <div class="study-info"> 
                    <div> 
                        <h4>NPM</h4>
                        <p>{{ npm }}</p>
                    </div>
                    <div> 
                        <h4>Program</h4>
                        <p>{{ study_program }}</p>
                    </div>
                </div>
                <div class="container-button">
                    <a href="https://github.com/ClevraldoLimuel" class="social-link">GitHub</a>
                    <a href="https://id.linkedin.com/in/clevraldo-limuel-87b20437b" class="social-link">LinkedIn</a>
                    <a href="mailto:aldolimuell@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>

</html>
