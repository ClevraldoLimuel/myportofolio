{% extends 'base.html' %}
<head>
    {% block meta %}
    <link rel="stylesheet" href="/static/css/experience.css">
    {% endblock meta %}
</head>
<body>
    {% block content %}
    <main>
        <section class="experience-section" id="experience">
            <div class="container">
                <p class="section-kicker">Perjalanan saya sejauh ini</p>
                <h1>Experience</h1>
                <button class="button button-secondary" onclick="showToast('Notifikasi Sistem', 'Experiences berhasil dimuat dengan baik!', 'success')">
                    Test Toast Notifikasi
                </button>
                <form id="experience-search-form" class="experience-search">
                        <input type="search"
                            id="search-input"
                            name="title"
                            value="{{ title_query }}"
                            placeholder="Cari berdasarkan nama experience"
                            class="experience-search__input"
                            aria-label="Cari berdasarkan nama experience">
                        <button type="submit" class="button">Cari</button>
                </form>
                <div class="experience-grid">
                    <!-- Loading State -->
                    <div id="loading" class="empty-state hide">
                        <p>Memuat experiences...</p>
                    </div>

                    <!-- Error State -->
                    <div id="error" class="empty-state hide">
                        <p>Gagal memuat data experiences. Silakan coba lagi.</p>
                    </div>

                    <!-- Empty State -->
                    <div id="empty" class="empty-state hide">
                        <p>Belum ada experience yang ditambahkan atau ditemukan.</p>
                    </div>

                    <!-- Project Grid -->
                    <div id="grid" class="experience-grid exp-grid hide"></div>

                </div>
            </div>
        </section>
    </main>

    <script>
    // Konfigurasi
    const BASE_EXPERIENCE_ENDPOINT = "{% url 'main:get_experience_json' %}";
    const IS_SUPERUSER = "{{ user.is_superuser|yesno:'true,false' }}" === "true";
    let experiencesAbortController;

    // Elemen DOM
    const loadingState = document.getElementById('loading');
    const errorState = document.getElementById('error');
    const emptyState = document.getElementById('empty');
    const gridContainer = document.getElementById('grid');
    const searchForm = document.getElementById('experience-search-form');
    const searchInput = document.getElementById('search-input');

    // Menyembunyikan/Menampilkan section halaman
    function displayPageSection({ showLoading = false, showError = false, showEmpty = false, showGrid = false }) {
        loadingState.classList.toggle('hide', !showLoading);
        errorState.classList.toggle('hide', !showError);
        emptyState.classList.toggle('hide', !showEmpty);
        gridContainer.classList.toggle('hide', !showGrid);
    }

    // Membuat elemen card experience
    function buildExperienceCardElement(item) {
        const experience = item.fields;
        const experienceId = item.pk;

        const articleElement = document.createElement('article');
        articleElement.className = 'experience-card';

        // Dummy UUID digunakan untuk digantikan oleh ID asli dari data JSON
        const deleteUrl = "{% url 'main:delete_project' '00000000-0000-0000-0000-000000000000' %}"
            .replace('00000000-0000-0000-0000-000000000000', experienceId);

        const deleteHtml = IS_SUPERUSER 
            ? `<form method="post" action="${deleteUrl}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="button button-danger" onclick="return confirm('Yakin ingin menghapus experience ini?');">Hapus</button>
            </form>`
            : '';

        // Komponen card
        const completeCardHtml = `
            <span class="experience-category">${experience.category}</span>
            <h2>${experience.title}</h2>
            <p class="experience-description">${experience.description}</p>

            {% comment %} <div class="project-card-actions">
                <div class="project-actions">
                    ${urlHtml}
                    
                    <form method="post" action="${starUrl}" class="star-form">
                        {% csrf_token %}
                        <button type="submit" 
                                class="button button-star${isStarredClass}"
                                title="${starTitle}">
                            <span aria-hidden="true">★</span>
                            ${starText}
                            <span class="star-count">${project.star_count}</span>
                        </button>
                    </form>

                    ${deleteHtml}
                </div>
            </div> {% endcomment %}

            ${experience.is_ongoing
                ? '<p class="experience-status">Sedang berlangsung</p>'
                : '<p class="experience-status">Selesai</p>'
            }
        
        `;

        articleElement.innerHTML = completeCardHtml;
        return articleElement;
    }

    // Fetch data project
    async function fetchExperiences(searchQuery = "") {
        if (experiencesAbortController) experiencesAbortController.abort();
        experiencesAbortController = new AbortController();

        try {
            displayPageSection({ showLoading: true });
            
            const url = searchQuery ? `${BASE_EXPERIENCE_ENDPOINT}?title=${encodeURIComponent(searchQuery)}` : BASE_EXPERIENCE_ENDPOINT;
            
            const response = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                signal: experiencesAbortController.signal,
            });

            if (!response.ok) throw new Error('Failed to fetch data');

            const experienceData = await response.json();

            if (experienceData.length === 0) {
                displayPageSection({ showEmpty: true });
            } else {
                gridContainer.innerHTML = '';
                experienceData.forEach(item => {
                    gridContainer.appendChild(buildExperienceCardElement(item));
                });
                displayPageSection({ showGrid: true });
            }
        } catch (error) {
            if (error.name === 'AbortError') return;
            console.error('Error loading experiences:', error);
            displayPageSection({ showError: true });
        }
    }

    // Event Handlers untuk Form Search
    searchForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman
        fetchExperiences(searchInput.value.trim()); // Jalankan pencarian via AJAX
    });

    // Start application
    fetchExperiences(searchInput.value.trim());
    </script>

    {% endblock content %}
</body>

</html>
